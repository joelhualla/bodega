<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Bodega{% endblock %}</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --txt:#1c2330; --mut:#6b7482; --line:#dfe3ea;
          --ok:#1f9d55; --warn:#d99a00; --bad:#d64545; --accent:#2457d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171c; --card:#1d2128; --txt:#e8ebf0; --mut:#98a1ae; --line:#303641; --accent:#6b93ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--txt); }
  header { display:flex; justify-content:space-between; align-items:center; padding:.8rem 1rem;
           background:var(--card); border-bottom:1px solid var(--line); }
  header a { color:var(--accent); text-decoration:none; font-weight:600; }
  main { max-width:1100px; margin:1rem auto; padding:0 1rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:1rem; margin-bottom:1rem; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:.55rem .6rem; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
  th { font-size:.8rem; text-transform:uppercase; color:var(--mut); }
  .wrap { overflow-x:auto; }
  .btn { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:.7rem 1.1rem;
         font-size:1rem; font-weight:600; cursor:pointer; text-decoration:none; display:inline-block; }
  .btn.sec { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .msg { padding:.6rem .9rem; border-radius:8px; margin-bottom:.5rem; border:1px solid var(--line); background:var(--card); }
  .msg.error { border-color:var(--bad); color:var(--bad); }
  .msg.warning { border-color:var(--warn); }
  .msg.success { border-color:var(--ok); color:var(--ok); }
  .tag { display:inline-block; padding:.1rem .5rem; border-radius:99px; font-size:.8rem; font-weight:600; border:1px solid var(--line); }
  .tag.verde { background:#1f9d5522; color:var(--ok); border-color:var(--ok); }
  .tag.amarillo { background:#d99a0022; color:var(--warn); border-color:var(--warn); }
  .tag.rojo { background:#d6454522; color:var(--bad); border-color:var(--bad); }
  .tag.sin_fecha { background:#d99a0022; color:var(--warn); border-color:var(--warn); }
  .tag.no_aplica { color:var(--mut); }
  .chips a { display:inline-block; margin:0 .4rem .4rem 0; padding:.35rem .8rem; border:1px solid var(--line);
             border-radius:99px; text-decoration:none; color:var(--txt); font-weight:600; background:var(--card); }
  .chips a.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .chips a.rojo { border-color:var(--bad); }
  .loc { font:700 1.15rem ui-monospace, monospace; }
  input.cant { width:6rem; font-size:1.2rem; padding:.4rem; text-align:center; border:2px solid var(--line);
               border-radius:8px; background:var(--bg); color:var(--txt); }
  #scan { width:100%; font-size:1.3rem; padding:.7rem; border:2px solid var(--accent); border-radius:10px;
          background:var(--bg); color:var(--txt); }
  tr.ok td { background:#1f9d5518; } tr.bad td { background:#d6454518; } tr.flash td { background:#2457d633; }
  .mut { color:var(--mut); font-size:.9rem; }
</style>
</head>
<body>
<header>
  <nav style="display:flex; gap:1rem; flex-wrap:wrap">
    <a href="{% url 'ordenes' %}">📦 Órdenes</a>
    <a href="{% url 'nuevo_pedido' %}">➕ Nuevo pedido</a>
    <a href="{% url 'stock' %}">📊 Stock</a>
    {% if es_supervisor %}<a href="{% url 'cargar_erp' %}">⬆ Cargar ERP</a>
    <a href="{% url 'calidad' %}">🔎 Calidad de datos</a>{% endif %}
  </nav>
  <span class="mut">{{ request.user.get_username }}
    <form method="post" action="{% url 'salir' %}" style="display:inline">{% csrf_token %}
      <button type="submit" style="background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:0">salir</button>
    </form></span>
</header>
<main>
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
